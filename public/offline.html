<!DOCTYPE html>
<html lang="am">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ሕንጸተ ሰብእ – የመስመር ውጭ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --primary: #9b5c12;
            --accent: #b99b6b;
            --bg-color: #fdfaf1;
            --text-main: #3e2f1c;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100dvh;
            overflow: hidden;
            width: 100%;
            font-family: 'Noto Sans Ethiopic', 'Merriweather', serif;
            background-color: var(--bg-color);
            background-image: url('/assets/images/parchment-grain.png');
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .manuscript-card {
            position: relative;
            max-width: 460px;
            width: 92%;
            padding: 2.5rem 1.5rem;
            /* Balanced mobile padding */
            background: rgba(255, 252, 245, 0.98);
            border: 1px solid var(--accent);
            box-shadow:
                0 0 0 6px rgba(255, 252, 245, 0.9),
                0 0 0 7px var(--accent),
                0 30px 60px rgba(0, 0, 0, 0.25);
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            margin: 20px 0;
        }

        .network-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(211, 47, 47, 0.1);
            color: #d32f2f;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(211, 47, 47, 0.2);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #d32f2f;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        /* Large High-Res Medallion */
        .image-medallion {
            width: 180px;
            height: 180px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: url('/assets/images/ennat.jpg') no-repeat center/cover;
            border: 5px solid var(--primary);
            outline: 3px solid var(--accent);
            outline-offset: 5px;
            box-shadow: 0 15px 35px rgba(155, 92, 18, 0.25);
            position: relative;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin: 0 0 1.5rem;
        }

        /* Restored Wisdom Box with Quotes */
        .wisdom-box {
            background: rgba(185, 155, 107, 0.1);
            border-top: 1px solid var(--accent);
            border-bottom: 1px solid var(--accent);
            padding: 2rem 1rem;
            margin-bottom: 2.5rem;
            position: relative;
        }

        .wisdom-box::before,
        .wisdom-box::after {
            content: "«";
            font-size: 2.5rem;
            color: var(--accent);
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: #fffcf5;
            padding: 0 15px;
            font-family: 'Merriweather', serif;
        }

        .wisdom-box::after {
            content: "»";
            top: auto;
            bottom: -30px;
        }

        .wisdom-text {
            font-size: 1.15rem;
            line-height: 1.9;
        }

        /* Button with Wavy Shimmer */
        .btn-retry {
            display: block;
            width: 100%;
            padding: 1.3rem;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            border-radius: 12px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(155, 92, 18, 0.4);
        }

        .btn-retry::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -100%;
            width: 100%;
            height: 200%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: rotate(30deg);
            animation: wavyShimmer 3.5s infinite;
        }

        @keyframes wavyShimmer {
            0% {
                left: -100%;
            }

            40%,
            100% {
                left: 100%;
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.5);
                opacity: 0.4;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer-logo {
            margin-top: 2.5rem;
            font-size: 0.95rem;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 400px) {
            .image-medallion {
                width: 160px;
                height: 160px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .wisdom-text {
                font-size: 1rem;
            }

            .manuscript-card {
                padding: 2rem 1.2rem;
            }
        }
    </style>
</head>

<body>
    <div class="manuscript-card">
        <div class="network-indicator">
            <div class="pulse-dot"></div>
            ግንኙነት ተቋርጧል
        </div>

        <div class="image-medallion"></div>

        <h1>ከመስመር ውጭ ነዎት</h1>

        <div class="wisdom-box">
            <div class="wisdom-text">
                የበይነመረብ ግንኙነትዎ ለጊዜው ተቋርጧል። ሆኖም ቀደም ብለው የጎበኟቸው ገጾች በመተግብሪያዎ ላይ ተቀምጠው ሊሆን ስለሚችል ይመለሱ።
            </div>
        </div>

        <a href="/" class="btn-retry">እንደገና ይሞክሩ</a>

        <div class="footer-logo">ሕንጸተ ሰብእ</div>
    </div>

    <script>
        window.addEventListener('online', () => { window.location.href = '/'; });

        document.querySelector('.btn-retry').addEventListener('click', () => {
            if (navigator.vibrate) navigator.vibrate(15);
        });
    </script>
</body>

</html>
